name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (NestJS + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rayti
          POSTGRES_PASSWORD: rayti
          POSTGRES_DB: rayti
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rayti" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Qualité du code (ESLint + Prettier)
        run: npm run lint
      - run: npm run build
      - name: Tests unitaires
        run: npm test
      - name: Tests de bout en bout (vraie base PostgreSQL)
        run: npm run test:e2e -- --forceExit

  web:
    name: Front (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Qualité du code (ESLint + Prettier)
        run: |
          npm run lint
          npm run format:check
      - name: Build de production
        run: npx ng build
      - name: Tests unitaires (Chrome headless)
        run: npm run test:ci

  e2e:
    name: Bout en bout (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build démo (données simulées, sans API)
        run: npm run build:demo
      - name: Tests de bout en bout
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
