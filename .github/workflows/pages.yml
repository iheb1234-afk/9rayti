name: Démo en ligne (GitHub Pages)

# Publie le front en mode démo (données simulées dans le navigateur) sur la branche gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build en mode démo (base /9rayti/)
        run: npx ng build --configuration demo
      - name: Repli SPA pour les liens directs
        run: |
          cd dist/frontend/browser
          cp index.html 404.html
          # Une copie de index.html par page fixe : les liens directs répondent 200 (et non 404).
          for r in recherche sessions comment-ca-marche devenir-tuteur a-propos contact cgu connexion inscription mon-espace espace-tuteur messages profil notifications admin; do
            mkdir -p "$r" && cp index.html "$r/index.html"
          done
          touch .nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist/frontend/browser
          commit_message: 'deploy: démo en ligne'
